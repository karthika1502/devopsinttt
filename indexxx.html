Here’s a simple `index.html` sample with a heading, a short intro, and a button:

```html name=index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <style>
    body {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #0969da;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Website</h1>
  <p>This is a sample HTML homepage. You can customize it with your own content.</p>
  <button type="button" onclick="alert('Hello!')">Click me</button>
</body>
</html>
```
